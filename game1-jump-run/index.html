<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跳跳侠 - 微信抖音小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; touch-action: none; user-select: none; font-family: 'PingFang SC', sans-serif; }
    canvas { display: block; margin: 0 auto; }
    
    #ui-overlay { position: fixed; top: 0; left: 0; right: 0; padding: 15px; display: flex; justify-content: space-between; align-items: center; color: white; z-index: 10; pointer-events: none; }
    #score-display { font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    #coin-display { font-size: 18px; color: #ffd700; }
    
    .screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
    .screen-title { font-size: 48px; font-weight: bold; margin-bottom: 15px; }
    .screen-sub { font-size: 18px; color: #aaa; margin-bottom: 35px; }
    .final-score { font-size: 72px; color: #ffd700; font-weight: bold; }
    .best-score { font-size: 16px; color: #aaa; margin-top: 8px; }
    .coin-balance { font-size: 20px; color: #ffd700; margin-top: 15px; }
    
    .btn { padding: 15px 50px; font-size: 20px; border: none; border-radius: 50px; cursor: pointer; margin: 10px; font-weight: bold; transition: transform 0.2s; }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-ad { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
    .btn-ad::before { content: '🎬 '; }
    
    .character-select { display: flex; gap: 15px; margin: 20px 0; }
    .char-option { width: 70px; height: 70px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 36px; transition: all 0.2s; }
    .char-option.selected { border-color: #667eea; transform: scale(1.1); }
    .char-option.unlocked { background: linear-gradient(135deg, #667eea, #764ba2); }
    .char-option.locked { opacity: 0.4; }
    
    #ad-notice { font-size: 13px; color: #888; margin-top: 15px; text-align: center; max-width: 280px; }
    .coin-display-big { font-size: 32px; color: #ffd700; margin: 10px 0; }
    
    /* 每日任务栏 */
    .daily-quest { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 15px 25px; margin: 15px 0; text-align: center; }
    .quest-title { font-size: 14px; color: #aaa; margin-bottom: 8px; }
    .quest-progress { font-size: 18px; color: #ffd700; }
    
    .screen { display: none; }
    #start-screen { display: flex; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-overlay">
  <div id="score-display">🏆 0</div>
  <div id="coin-display">💰 0</div>
</div>

<div id="start-screen" class="screen">
  <div class="screen-title">🧑‍🚀 跳跳侠</div>
  <div class="screen-sub">点击跳跃，躲避障碍物</div>
  <div class="daily-quest" id="quest-display">
    <div class="quest-title">📋 今日任务</div>
    <div class="quest-progress" id="quest-text">击杀0/30个障碍物</div>
  </div>
  <div class="character-select" id="char-select"></div>
  <button class="btn btn-primary" id="start-btn">开始游戏</button>
  <button class="btn btn-ad" id="unlock-all-btn" style="font-size:14px;padding:10px 30px;">🎬 解锁全部角色</button>
  <div id="ad-notice">观看广告可解锁角色 · 看广告双倍今日收益</div>
</div>

<div id="revive-screen" class="screen">
  <div class="screen-title">💀 游戏结束</div>
  <div class="screen-sub">看广告立即复活！</div>
  <button class="btn btn-ad" id="revive-btn">看广告复活</button>
  <button class="btn btn-primary" id="revive-skip-btn">算了</button>
  <div class="coin-display-big" id="revive-coins">+0 💰</div>
</div>

<div id="gameover-screen" class="screen">
  <div class="screen-title">游戏结束</div>
  <div class="final-score" id="final-score">0</div>
  <div class="best-score" id="best-score">历史最高: 0</div>
  <div class="coin-display-big" id="earned-coins">+0 💰</div>
  <button class="btn btn-primary" id="restart-btn">再玩一次</button>
  <button class="btn btn-ad" id="double-btn">🎬 看广告双倍金币</button>
</div>

<script>
// ============================================================
// 游戏引擎
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = Math.min(window.innerWidth, 500);
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 存档
// ============================================================
let save = {
  best: 0,
  coins: 0,
  unlocked: [0],
  selectedChar: 0,
  todayKills: 0,
  todayDate: '',
  todayEarnings: 0
};

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem('jumpGame_v2') || '{}');
    save = { ...save, ...s };
  } catch(e) {}
  checkDailyReset();
}
function saveToStorage() {
  localStorage.setItem('jumpGame_v2', JSON.stringify(save));
}
function checkDailyReset() {
  const today = new Date().toDateString();
  if (save.todayDate !== today) {
    save.todayKills = 0;
    save.todayDate = today;
    save.todayEarnings = 0;
  }
}
loadSave();

const CHARACTERS = [
  { emoji: '🧑', name: '萌新', color: '#667eea' },
  { emoji: '🦸', name: '超人', color: '#e74c3c' },
  { emoji: '🤖', name: '机器人', color: '#3498db' },
  { emoji: '👾', name: '外星人', color: '#2ecc71' },
  { emoji: '🦊', name: '狐狸', color: '#f39c12' },
  { emoji: '🦁', name: '狮子', color: '#f1c40f' },
  { emoji: '🐲', name: '神龙', color: '#9b59b6' },
  { emoji: '👑', name: '国王', color: '#ffd700' },
];

// ============================================================
// 状态
// ============================================================
const GAME_STATE = { MENU: 'menu', PLAYING: 'playing', DEAD: 'dead', GAMEOVER: 'gameover' };
let state = GAME_STATE.MENU;
let score = 0;
let coins = save.coins;
let bestScore = save.best;
let obstacles = [];
let obstacleTimer = 0;
let groundOffset = 0;
let revived = false;
let kills = save.todayKills;
let gameSpeed = 6;

const player = {
  x: 80, y: 0, w: 40, h: 50,
  vy: 0, grounded: false,
  jumpPower: -16,
  gravity: 0.65,
  groundY: 0,
  
  reset() {
    this.y = this.groundY - this.h;
    this.vy = 0;
    this.grounded = true;
  },
  jump() {
    if (this.grounded) {
      this.vy = this.jumpPower;
      this.grounded = false;
    }
  },
  update() {
    this.vy += this.gravity;
    this.y += this.vy;
    const ground = canvas.height - 80;
    if (this.y + this.h > ground) {
      this.y = ground - this.h;
      this.vy = 0;
      this.grounded = true;
    }
  },
  draw() {
    const c = CHARACTERS[save.selectedChar];
    // 身体
    const grad = ctx.createRadialGradient(this.x + this.w/2, this.y + this.h/2 - 5, 0, this.x + this.w/2, this.y + this.h/2, this.h * 0.6);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, c.color);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x + this.w/2, this.y + this.h/2, this.h * 0.45, 0, Math.PI * 2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(this.x + this.w/2 - 6, this.y + this.h/2 - 3, 4, 0, Math.PI * 2);
    ctx.arc(this.x + this.w/2 + 6, this.y + this.h/2 - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    // Emoji
    ctx.font = `${this.h * 0.7}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.emoji, this.x + this.w/2, this.y + this.h/2 + 2);
  }
};

// ============================================================
// 广告模拟
// ============================================================
function showRewardedAd(callback) {
  const overlay = document.createElement('div');
  overlay.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;color:white;font-family:PingFang SC,sans-serif;';
  overlay.innerHTML = '<div style="font-size:56px;margin-bottom:20px;">🎬</div><div style="font-size:24px;margin-bottom:15px;">广告播放中...</div><div style="font-size:14px;color:#888;">（真实项目中替换为平台SDK）</div><div style="margin-top:20px;font-size:40px;">❤️‍🔥</div>';
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.remove();
    if (callback) callback(true);
  }, 2500);
}

// ============================================================
// 障碍物
// ============================================================
const OBSTACLE_TYPES = [
  { type: 'spike', h: 50, w: 30, color: '#e74c3c' },
  { type: 'spike', h: 70, w: 35, color: '#c0392b' },
  { type: 'block', h: 45, w: 45, color: '#9b59b6' },
  { type: 'block', h: 70, w: 35, color: '#8e44ad' },
  { type: 'double', h: 50, w: 30, color: '#e74c3c' },
];

function spawnObstacle() {
  const template = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  const ground = canvas.height - 80;
  
  if (template.type === 'double') {
    obstacles.push({ ...template, x: canvas.width, y: ground - template.h, passed: false });
    obstacles.push({ ...template, x: canvas.width + 70, y: ground - template.h - 20, passed: false });
  } else {
    obstacles.push({ ...template, x: canvas.width, y: ground - template.h, passed: false });
  }
}

function updateObstacles() {
  gameSpeed = 6 + Math.min(score / 80, 6);
  
  obstacleTimer++;
  const interval = Math.max(45, 90 - Math.min(score / 5, 50));
  if (obstacleTimer >= interval) {
    spawnObstacle();
    obstacleTimer = 0;
  }
  
  obstacles.forEach(obs => {
    obs.x -= gameSpeed;
    // 检测是否通过
    if (!obs.passed && obs.x + obs.w < player.x) {
      obs.passed = true;
      score += 5;
      kills++;
      updateQuestDisplay();
    }
  });
  obstacles = obstacles.filter(obs => obs.x + obs.w > -50);
}

function drawObstacles() {
  obstacles.forEach(obs => {
    if (obs.type === 'spike') {
      const grad = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.w, obs.y + obs.h);
      grad.addColorStop(0, obs.color);
      grad.addColorStop(1, '#922b21');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w/2, obs.y);
      ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
      ctx.lineTo(obs.x, obs.y + obs.h);
      ctx.closePath();
      ctx.fill();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.w/2, obs.y + 5);
      ctx.lineTo(obs.x + obs.w * 0.7, obs.y + obs.h * 0.5);
      ctx.lineTo(obs.x + obs.w/2, obs.y + obs.h * 0.5);
      ctx.closePath();
      ctx.fill();
    } else {
      const grad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.h);
      grad.addColorStop(0, obs.color);
      grad.addColorStop(1, '#2c3e50');
      ctx.fillStyle = grad;
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }
  });
}

// ============================================================
// 背景
// ============================================================
let bgOffset = 0;
let starPositions = [];
for (let i = 0; i < 60; i++) {
  starPositions.push({ x: Math.random() * 500, y: Math.random() * 600, r: Math.random() * 1.5 + 0.5, speed: Math.random() * 0.5 + 0.1 });
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // 星星
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  starPositions.forEach(star => {
    const sx = (star.x + bgOffset * star.speed) % canvas.width;
    ctx.beginPath();
    ctx.arc(sx, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // 地面
  const groundY = canvas.height - 80;
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
  groundGrad.addColorStop(0, '#27ae60');
  groundGrad.addColorStop(1, '#1e8449');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, canvas.width, 80);
  
  // 地面纹理
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  for (let i = 0; i < canvas.width / 25 + 2; i++) {
    const lx = (i * 50 - bgOffset % 50);
    ctx.beginPath();
    ctx.moveTo(lx, groundY);
    ctx.lineTo(lx + 20, canvas.height);
    ctx.stroke();
  }
  
  // 分隔线
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(0, groundY, canvas.width, 4);
}

function updateGround() {
  bgOffset += gameSpeed;
}

// ============================================================
// 碰撞
// ============================================================
function checkCollision() {
  const px = player.x + 5, py = player.y + 5, pw = player.w - 10, ph = player.h - 10;
  
  for (const obs of obstacles) {
    if (obs.type === 'spike') {
      const cx = obs.x + obs.w/2;
      const cy = obs.y + obs.h * 0.3;
      const dx = (px + pw/2) - cx;
      const dy = (py + ph/2) - cy;
      if (Math.sqrt(dx*dx + dy*dy) < obs.w * 0.45 + pw * 0.3) return true;
    } else {
      if (px < obs.x + obs.w && px + pw > obs.x && py < obs.y + obs.h && py + ph > obs.y) return true;
    }
  }
  return false;
}

// ============================================================
// 分数 & 任务
// ============================================================
function updateQuestDisplay() {
  const target = 30;
  document.getElementById('quest-text').textContent = `击杀${kills}/${target}个障碍物`;
  if (kills >= target) {
    document.getElementById('quest-text').style.color = '#2ecc71';
    document.getElementById('quest-text').textContent = `✅ 今日任务完成！`;
  }
}

function updateScore() {
  score = kills * 5 + Math.max(0, Math.floor((canvas.height - 80 - player.y) / 10));
  document.getElementById('score-display').textContent = '🏆 ' + score;
  document.getElementById('coin-display').textContent = '💰 ' + coins;
}

// ============================================================
// 游戏流程
// ============================================================
function startGame() {
  state = GAME_STATE.PLAYING;
  score = 0;
  obstacles = [];
  obstacleTimer = 0;
  bgOffset = 0;
  revived = false;
  
  player.groundY = canvas.height - 80;
  player.reset();
  
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('gameover-screen').style.display = 'none';
  document.getElementById('revive-screen').style.display = 'none';
  document.getElementById('ui-overlay').style.display = 'flex';
}

function gameOver() {
  if (state !== GAME_STATE.PLAYING) return;
  state = GAME_STATE.DEAD;
  
  const earned = Math.floor(score / 5);
  save.todayKills = kills;
  save.todayEarnings += earned;
  
  if (!revived) {
    document.getElementById('revive-coins').textContent = `+${earned} 💰`;
    document.getElementById('revive-screen').style.display = 'flex';
    document.getElementById('ui-overlay').style.display = 'none';
  } else {
    endGame();
  }
}

function reviveWithAd() {
  showRewardedAd(() => {
    revived = true;
    player.reset();
    state = GAME_STATE.PLAYING;
    document.getElementById('revive-screen').style.display = 'none';
    document.getElementById('ui-overlay').style.display = 'flex';
  });
}

function endGame() {
  state = GAME_STATE.GAMEOVER;
  
  const earned = Math.floor(score / 5);
  coins += earned;
  
  if (score > bestScore) {
    bestScore = score;
    save.best = bestScore;
  }
  save.coins = coins;
  save.todayKills = kills;
  saveToStorage();
  
  document.getElementById('final-score').textContent = score;
  document.getElementById('best-score').textContent = '历史最高: ' + bestScore;
  document.getElementById('earned-coins').textContent = `+${earned} 💰`;
  document.getElementById('gameover-screen').style.display = 'flex';
  document.getElementById('ui-overlay').style.display = 'none';
}

// ============================================================
// 主循环
// ============================================================
function gameLoop() {
  if (state === GAME_STATE.PLAYING) {
    drawBackground();
    updateGround();
    updateObstacles();
    player.update();
    player.draw();
    drawObstacles();
    updateScore();
    if (checkCollision()) gameOver();
  }
  requestAnimationFrame(gameLoop);
}

// ============================================================
// 输入
// ============================================================
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (state === GAME_STATE.PLAYING) player.jump(); }, { passive: false });
canvas.addEventListener('mousedown', () => { if (state === GAME_STATE.PLAYING) player.jump(); });
document.addEventListener('keydown', e => { if (e.code === 'Space' && state === GAME_STATE.PLAYING) { e.preventDefault(); player.jump(); } });

// ============================================================
// UI 事件
// ============================================================
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('gameover-screen').style.display = 'none';
  startGame();
});
document.getElementById('revive-btn').addEventListener('click', reviveWithAd);
document.getElementById('revive-skip-btn').addEventListener('click', endGame);
document.getElementById('double-btn').addEventListener('click', () => {
  showRewardedAd(() => {
    const bonus = Math.floor(score / 5);
    coins += bonus;
    save.coins = coins;
    saveToStorage();
    document.getElementById('earned-coins').textContent = `+${Math.floor(score/5)*2} 💰（已双倍！）`;
    document.getElementById('double-btn').textContent = '已双倍！';
    document.getElementById('double-btn').disabled = true;
  });
});
document.getElementById('unlock-all-btn').addEventListener('click', () => {
  showRewardedAd(() => {
    save.unlocked = CHARACTERS.map((_, i) => i);
    saveToStorage();
    renderCharSelect();
    document.getElementById('unlock-all-btn').textContent = '已解锁全部角色！';
    document.getElementById('unlock-all-btn').disabled = true;
  });
});

function renderCharSelect() {
  const container = document.getElementById('char-select');
  container.innerHTML = '';
  CHARACTERS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'char-option' + (save.unlocked.includes(i) ? ' unlocked' : ' locked') + (save.selectedChar === i ? ' selected' : '');
    el.textContent = c.emoji;
    el.title = save.unlocked.includes(i) ? c.name : `${c.name} 🔒`;
    el.addEventListener('click', () => {
      if (!save.unlocked.includes(i)) {
        showRewardedAd(() => {
          save.unlocked.push(i);
          save.selectedChar = i;
          saveToStorage();
          renderCharSelect();
        });
      } else {
        save.selectedChar = i;
        saveToStorage();
        renderCharSelect();
      }
    });
    container.appendChild(el);
  });
}

// 初始化
document.getElementById('ui-overlay').style.display = 'none';
player.groundY = canvas.height - 80;
renderCharSelect();
updateQuestDisplay();
document.getElementById('coin-display').textContent = '💰 ' + coins;
gameLoop();
</script>
</body>
</html>
