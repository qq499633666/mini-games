<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;user-select:none}
canvas{border:2px solid #2d5a27;border-radius:8px;background:#0d1f0d}
#ui{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:30px;color:#7cfc00;font-size:18px;font-family:system-ui}
#ad-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:10}
#ad-panel{background:#1a1a2e;border:2px solid #ff6b35;border-radius:16px;padding:30px;text-align:center;color:white}
#ad-title{font-size:22px;margin-bottom:8px;color:#ff6b35}
#ad-desc{font-size:14px;color:#aaa;margin-bottom:20px}
.ad-btn{display:block;width:200px;padding:14px;background:#ff6b35;border:none;border-radius:25px;color:white;font-size:16px;cursor:pointer;margin:8px auto}
.ad-btn:hover{background:#ff4500}
#ad-countdown{font-size:28px;color:#7cfc00;margin:15px 0}
#start-screen{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:20}
#start-screen h1{color:#7cfc00;font-size:36px;margin-bottom:10px}
#start-screen p{color:#aaa;margin-bottom:30px;font-size:14px}
#start-btn{padding:14px 40px;background:#7cfc00;border:none;border-radius:25px;color:#0a0a1a;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="ui"><span id="score">得分: 0</span><span id="hi">最高: 0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="ad-overlay">
<div id="ad-panel">
<div id="ad-title">🎮 看广告加命</div>
<div id="ad-desc">看视频广告立即复活！</div>
<div id="ad-countdown">3</div>
<button class="ad-btn" onclick="skipAd()">观看广告 (+1命)</button>
<button class="ad-btn" onclick="closeAd()" style="background:#555">稍后再说</button>
</div>
</div>
<div id="start-screen">
<h1>🐍 贪吃蛇</h1>
<p>用方向键或滑动控制蛇移动<br>吃食物增长，撞墙或自己就结束</p>
<button id="start-btn" onclick="startGame()">开始游戏</button>
<div id="ad-hint" style="margin-top:20px;color:#666;font-size:13px"></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const S=20,COLS=c.width/S,ROWS=c.height/S;
let g,snake,dir,food,score,hiscore=0,alive,ad Lives=3;
const saved=localStorage.getItem('snake_hi');if(saved)hiscore=+saved;

function drawCell(x,y,color,emoji){
ctx.fillStyle=color;
ctx.fillRect(x*S+1,y*S+1,S-2,S-2);
if(emoji){ctx.font='16px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emoji,x*S+S/2,y*S+S/2);}
}

function newFood(){
let p;
do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
while(snake.some(s=>s.x===p.x&&s.y===p.y));
food=p;
}

function startGame(){
document.getElementById('start-screen').style.display='none';
snake=[{x:10,y:10}];dir={x:1,y:0};score=0;alive=true;adLives=3;
newFood();document.getElementById('score').textContent='得分: 0';
}

let gameInterval;
function startLoop(){
if(gameInterval)clearInterval(gameInterval);
gameInterval=setInterval(tick,120);
}

function tick(){
if(!alive)return;
const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){
alive=false;clearInterval(gameInterval);
if(score>hiscore){hiscore=score;localStorage.setItem('snake_hi',hiscore);}
document.getElementById('hi').textContent='最高: '+hiscore;
setTimeout(showAd,300);
return;
}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score+=10;newFood();}
else snake.pop();
render();
document.getElementById('score').textContent='得分: '+score;
}

function render(){
ctx.clearRect(0,0,c.width,c.height);
ctx.strokeStyle='#1a3a1a';ctx.lineWidth=0.5;
for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,c.height);ctx.stroke();}
for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(c.width,y*S);ctx.stroke();}
drawCell(food.x,food.y,'#ff4444','🍎');
snake.forEach((s,i)=>drawCell(s.x,s.y,i===0?'#7cfc00':'#32cd32',i===0?'🐍':null));
}

function showAd(){
if(adLives<=0){
document.getElementById('hi').textContent='最高: '+hiscore;
return;
}
document.getElementById('ad-overlay').style.display='flex';
let n=3;
document.getElementById('ad-countdown').textContent=n;
const iv=setInterval(()=>{n--;document.getElementById('ad-countdown').textContent=n;if(n<=0)clearInterval(iv);},1000);
}

function skipAd(){
document.getElementById('ad-overlay').style.display='none';
adLives--;
alive=true;
const h=snake[snake.length-1];
snake=[{x:h.x,y:h.y}];
newFood();startLoop();
}

function closeAd(){
document.getElementById('ad-overlay').style.display='none';
document.getElementById('hi').textContent='最高: '+hiscore;
}

document.addEventListener('keydown',e=>{
if(!alive)return;
const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
if(map[e.key]){e.preventDefault();dir=map[e.key];}
});
let touchStart=null;
c.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault();},{passive:false});
c.addEventListener('touchend',e=>{
if(!touchStart||!alive)return;
const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;
if(Math.abs(dx)>Math.abs(dy))dir={x:dx>0?1:-1,y:0};
else dir={x:0,y:dy>0?1:-1};
touchStart=null;
},{passive:false});
</script>
</body>
</html>
