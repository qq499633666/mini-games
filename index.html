<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免费小游戏合集 - 抖音微信小程序</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      font-family: 'PingFang SC', -apple-system, sans-serif;
      color: white;
      padding: 40px 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    
    h1 { text-align: center; font-size: 36px; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 40px; font-size: 16px; }
    
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    
    .game-card {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border-color: rgba(102,126,234,0.5);
    }
    
    .card-preview {
      height: 140px;
      display: flex; align-items: center; justify-content: center;
      font-size: 64px;
    }
    
    .card-info { padding: 15px 20px 20px; }
    .card-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #aaa; margin-bottom: 10px; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      background: rgba(102,126,234,0.3);
      color: #aab;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
    }
    
    .hero-section {
      text-align: center;
      margin-bottom: 50px;
      padding: 40px 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .hero-emoji { font-size: 80px; margin-bottom: 15px; }
    .hero-title { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
    .hero-sub { color: #888; font-size: 15px; }
    
    .footer {
      text-align: center;
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="hero-section">
      <div class="hero-emoji">🎮</div>
      <div class="hero-title">免费小游戏合集</div>
      <div class="hero-sub">无需下载，即点即玩 · 支持抖音/微信</div>
    </div>
    
    <div class="games-grid">
      
      <a class="game-card" href="game1-jump-run/">
        <div class="card-preview" style="background: linear-gradient(135deg, #667eea, #764ba2);">🧑‍🚀</div>
        <div class="card-info">
          <div class="card-title">跳跳侠</div>
          <div class="card-desc">控制角色跳跃躲避障碍物，看广告复活</div>
          <div class="card-tags">
            <span class="tag">跑酷</span>
            <span class="tag">跳跃</span>
            <span class="tag">复活广告</span>
          </div>
        </div>
      </a>
      
      <a class="game-card" href="game2-marble-shooter/">
        <div class="card-preview" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">🎯</div>
        <div class="card-info">
          <div class="card-title">弹珠超人</div>
          <div class="card-desc">拉满发射弹珠，击中全部目标过关</div>
          <div class="card-tags">
            <span class="tag">射击</span>
            <span class="tag">弹珠</span>
            <span class="tag">关卡制</span>
          </div>
        </div>
      </a>
      
      <a class="game-card" href="game3-2048/">
        <div class="card-preview" style="background: linear-gradient(135deg, #f093fb, #f5576c);">🔢</div>
        <div class="card-info">
          <div class="card-title">2048 益智</div>
          <div class="card-desc">滑动合并数字，挑战2048高分</div>
          <div class="card-tags">
            <span class="tag">益智</span>
            <span class="tag">2048</span>
            <span class="tag">撤销提示</span>
          </div>
        </div>
      </a>
      
      <a class="game-card" href="game4-fruit-catcher/">
        <div class="card-preview" style="background: linear-gradient(135deg, #11998e, #38ef7d);">🍓</div>
        <div class="card-info">
          <div class="card-title">水果接接乐</div>
          <div class="card-desc">移动篮子接水果，躲避炸弹，连击加分</div>
          <div class="card-tags">
            <span class="tag">反应</span>
            <span class="tag">收集</span>
            <span class="tag">连击</span>
          </div>
        </div>
      </a>
      
      <a class="game-card" href="game5-bubble-shooter/">
        <div class="card-preview" style="background: linear-gradient(135deg, #654ea3, #eaafc8);">🫧</div>
        <div class="card-info">
          <div class="card-title">泡泡龙消消乐</div>
          <div class="card-desc">发射泡泡，3个以上相同颜色消除</div>
          <div class="card-tags">
            <span class="tag">消除</span>
            <span class="tag">泡泡龙</span>
            <span class="tag">关卡制</span>
          </div>
        </div>
      </a>
      
    </div>
    
    <div class="footer">
      <p>🎮 免费小游戏 · 抖音微信小程序同款</p>
      <p style="margin-top:8px;">广告变现模式：激励视频（复活/道具/双倍金币）</p>
    </div>
    
  </div>
</body>
</html>
